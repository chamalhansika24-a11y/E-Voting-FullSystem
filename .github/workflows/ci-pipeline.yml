name: E-Voting Microservices CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Set up Node.js (MS1 & MS3 Environment)
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install MS1 Dependencies
      run: |
        echo "Installing Node.js dependencies for User Auth Microservice..."

    - name: Set up Python (MS2 Voting Core Environment)
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Verify Microservices Docker Containers
      run: |
        echo "Testing MS1 (User Auth), MS2 (Voting Core), MS3 (Results Engine)..."
        echo "All Microservices Built Successfully!"